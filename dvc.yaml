
stages:
  preprocess_data:
    cmd: python src/data_preparation.py
    deps:
      - src/data_preparation.py
      - data/raw/bank-additional-full.csv
    outs:
      - data/processed/bank-processed.csv
      - docs/transformations.txt

  visualize_data:
    cmd: python src/data_visualization.py
    deps:
      - src/data_visualization.py
      - data/processed/bank-processed.csv
    outs:
      - docs/figure/

  test_data_quality:
    cmd: pytest test/test_data_quality.py -v --html=docs/test_results/test_results.html --self-contained-html --junitxml=docs/test_results/test_results.xml
    deps:
      - test/test_data_quality.py
      - data/processed/bank-processed.csv
    outs:
      - docs/test_results/test_results.html
      - docs/test_results/test_results.xml

  test_data_gx:
    cmd: pytest test/test_data_gx.py -v --html=docs/test_results/test_results_gx.html --self-contained-html --junitxml=docs/test_results/test_results_gx.xml
    deps:
      - test/test_data_gx.py
      - data/processed/bank-processed.csv
    outs:
      - docs/test_results/test_results_gx.html
      - docs/test_results/test_results_gx.xml

  train_model:
    cmd: python src/train_model.py
    deps:
      - src/train_model.py
      - data/processed/bank-processed.csv
    outs:
      - models/best_model.joblib
      - reports/model_comparison.csv
    metrics:
      - reports/metrics.json

